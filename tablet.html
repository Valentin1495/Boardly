<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>태블릿 지도</title>
    <script
      type="text/javascript"
      src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=oa4bqnkx4u"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map" style="width: 100%; height: 416px"></div>

    <script>
      var mapOptions = {
        center: new naver.maps.LatLng(37.493067, 127.008399),
        zoom: 17,
      };

      var map = new naver.maps.Map('map', mapOptions);

      var marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(37.493067, 127.008399),
        map: map,
      });
    </script>
  </body>
</html>
